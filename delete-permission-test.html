<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DELETE PERMISSION TEST</title>
<style>
body {
  background: #111;
  color: white;
  font-family: sans-serif;
  padding: 20px;
}
button {
  width: 100%;
  padding: 16px;
  background: #493080;
  color: white;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
}
pre {
  background: #222;
  padding: 15px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>

<h2>DELETE PERMISSION TEST</h2>
<p>削除権限検証（実際の削除なし）</p>

<button onclick="runTest()">権限テスト実行</button>

<pre id="result">実行待ち</pre>

<script>
async function runTest() {
  const result = document.getElementById("result");

  try {
    const session = JSON.parse(
      localStorage.getItem("sanno_session_v1") || "null"
    );

    if (!session?.access_token) {
      result.textContent = "ログイン情報がありません";
      return;
    }

    result.textContent = "検証中...";

    const response = await fetch(
      "https://xiqtfetzlzqkbhgyseqh.supabase.co/functions/v1/sanno-delete-player",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + session.access_token,
          "apikey": "sb_publishable_8V5gGyppGf-7P8iVSTOetw_QNPUYhIf"
        },
        body: JSON.stringify({
          target_user_id: "7833ff84-d8fc-4dbb-bd1f-e03a6484e3cc",
confirm: true,
confirm_display_name: "最終削除テスト"
        })
      }
    );

    const data = await response.text();

    result.textContent =
      "HTTP STATUS: " + response.status +
      "\n\n" + data;

  } catch (error) {
    result.textContent = error.message;
  }
}
</script>

</body>
</html>
