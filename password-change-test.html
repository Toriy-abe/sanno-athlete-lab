<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>SANNO PASSWORD CHANGE TEST</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 24px 16px;
  background: #101014;
  color: #fff;
  font-family: -apple-system, sans-serif;
}
.card {
  max-width: 480px;
  margin: auto;
  padding: 24px;
  background: #1c1c24;
  border: 1px solid #514080;
  border-radius: 18px;
}
h1 {
  font-size: 23px;
  margin-bottom: 6px;
}
.sub {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 24px;
}
label {
  display: block;
  margin-top: 18px;
  font-size: 14px;
}
input:not([type="checkbox"]) {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  background: #101014;
  color: white;
  border: 1px solid #555;
  border-radius: 9px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 18px;
  background: #59418e;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}
button:disabled {
  opacity: .4;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #101014;
  padding: 14px;
  border-radius: 9px;
  font-size: 13px;
  line-height: 1.6;
}
.warning {
  color: #ffcc66;
  font-size: 13px;
  line-height: 1.7;
}
</style>
</head>

<body>
<div class="card">

<h1>PASSWORD CHANGE</h1>
<div class="sub">
SANNO ATHLETE LAB / TEST MODE
</div>

<p class="warning">
検証用アカウント専用画面です。<br>
パスワード検証テストでログインしてください。
</p>

<button id="check">
ログイン状態を確認
</button>

<pre id="status">未確認</pre>

<form id="form">

<label for="temporary">
現在の仮パスワード
</label>
<input id="temporary"
type="password"
autocomplete="current-password"
required>

<label for="newPassword">
新しいパスワード（8文字以上）
</label>
<input id="newPassword"
type="password"
autocomplete="new-password"
minlength="8"
required>

<label for="confirmPassword">
新しいパスワード（確認）
</label>
<input id="confirmPassword"
type="password"
autocomplete="new-password"
required>

<label>
<input id="show" type="checkbox">
パスワードを表示
</label>

<button id="change" type="submit" disabled>
CHANGE PASSWORD / パスワード変更
</button>

</form>

<pre id="result">実行待ち</pre>

<button id="home">
正式版に戻る
</button>

</div>

<script>
const URL =
  "https://xiqtfetzlzqkbhgyseqh.supabase.co";

const KEY =
  "sb_publishable_8V5gGyppGf-7P8iVSTOetw_QNPUYhIf";

const TEST_ID =
  "b1fc45aa-7721-476e-8994-ca552d772e75";

const $ = id =>
  document.getElementById(id);

let verified = false;
let busy = false;
let checkedToken = null;

function getToken() {
  try {
    return JSON.parse(
      localStorage.getItem("sanno_session_v1")
      || "null"
    )?.access_token || null;
  } catch {
    return null;
  }
}

function headers(token) {
  return {
    "apikey": KEY,
    "Authorization": "Bearer " + token,
    "Content-Type": "application/json"
  };
}

function clearPasswords() {
  $("temporary").value = "";
  $("newPassword").value = "";
  $("confirmPassword").value = "";
  $("show").checked = false;

  for (const id of [
    "temporary",
    "newPassword",
    "confirmPassword"
  ]) {
    $(id).type = "password";
  }
}

$("show").onchange = () => {
  for (const id of [
    "temporary",
    "newPassword",
    "confirmPassword"
  ]) {
    $(id).type =
      $("show").checked ? "text" : "password";
  }
};

$("check").onclick = async () => {
  if (busy) return;

  verified = false;
  checkedToken = null;
  $("change").disabled = true;
  $("check").disabled = true;
  $("status").textContent = "確認中...";

  try {
    const token = getToken();

    if (!token) {
      throw new Error("ログイン情報がありません");
    }

    const userResponse = await fetch(
      URL + "/auth/v1/user",
      { headers: headers(token) }
    );

    if (!userResponse.ok) {
      throw new Error("ログイン認証失敗");
    }

    const user = await userResponse.json();

    if (user.id !== TEST_ID) {
      throw new Error("検証用アカウントではありません");
    }

    const stateResponse = await fetch(
      URL + "/rest/v1/rpc/sanno_must_change_password",
      {
        method: "POST",
        headers: headers(token),
        body: "{}"
      }
    );

    if (!stateResponse.ok) {
      throw new Error("変更要求の取得失敗");
    }

    const required = await stateResponse.json();

    if (required !== true) {
      throw new Error("パスワード変更要求なし");
    }

    verified = true;
    checkedToken = token;

    $("status").textContent =
      "LOGIN: OK\n" +
      "ACCOUNT: パスワード検証テスト\n" +
      "PASSWORD RESET REQUIRED: true";

    $("change").disabled = false;

  } catch (error) {
    $("status").textContent = error.message;
  } finally {
    $("check").disabled = false;
  }
};

$("form").onsubmit = async event => {
  event.preventDefault();

  if (!verified || busy) return;

  const token = getToken();

  if (!token || token !== checkedToken) {
    verified = false;
    $("change").disabled = true;
    $("result").textContent =
      "ログイン状態を再確認してください";
    return;
  }

  const temporary = $("temporary").value;
  const password = $("newPassword").value;
  const confirmation = $("confirmPassword").value;

  if (
    password.length < 8 ||
    new TextEncoder().encode(password).length > 72
  ) {
    $("result").textContent =
      "新しいパスワードの長さが不適切です";
    return;
  }

  if (password !== confirmation) {
    $("result").textContent =
      "新しいパスワードが一致しません";
    return;
  }

  if (temporary === password) {
    $("result").textContent =
      "仮パスワードとは異なるものを設定してください";
    return;
  }

  if (!confirm("パスワードを変更しますか？")) {
    return;
  }

  busy = true;
  $("change").disabled = true;
  $("check").disabled = true;
  $("result").textContent = "変更処理中...";

  try {
    const response = await fetch(
      URL + "/functions/v1/sanno-change-password",
      {
        method: "POST",
        headers: headers(token),
        body: JSON.stringify({
          temporary_password: temporary,
          new_password: password
        })
      }
    );

    const data = await response.json();

    if (
      !response.ok ||
      data.success !== true ||
      data.password_changed !== true ||
      data.must_change_password !== false
    ) {
      throw new Error(
        data.error || "パスワード変更失敗"
      );
    }

    clearPasswords();
    localStorage.removeItem("sanno_session_v1");

    verified = false;
    checkedToken = null;

    $("status").textContent = "LOGGED OUT";

    $("result").textContent =
      "SUCCESS\n" +
      "パスワード変更完了\n" +
      "利用制限解除完了\n" +
      "新しいパスワードで再ログインしてください";

  } catch (error) {
    verified = false;
    checkedToken = null;

    $("result").textContent =
      "ERROR\n" + error.message +
      "\n再実行前に管理者へ確認してください";

  } finally {
    clearPasswords();
    busy = false;
    $("check").disabled = false;
    $("change").disabled = true;
  }
};

$("home").onclick = () => {
  clearPasswords();
  location.href = "./";
};

window.addEventListener("pagehide", clearPasswords);
</script>
</body>
</html>
