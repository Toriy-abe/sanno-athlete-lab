<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SANNO Network Test</title><style>body{background:#111018;color:#fff;font:16px system-ui;padding:20px;max-width:600px;margin:auto}button,input{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:8px;border:1px solid #8876b5;font-size:16px}button{background:#382561;color:white}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#222;padding:14px}</style><h1>NETWORK TEST</h1><p>ADMIN専用・パスワード検証テスト限定。実際に仮パスワードを変更します。正式版の操作と同時に実行しないでください。</p><input id="name" placeholder="対象者の氏名" autocomplete="off"><button id="status">状態確認</button><button id="parallel">並列発行（2件）</button><button id="abort">応答受信中断テスト</button><pre id="out">未実行</pre><script>
const base='https://xiqtfetzlzqkbhgyseqh.supabase.co', key='sb_publishable_8V5gGyppGf-7P8iVSTOetw_QNPUYhIf', id='b1fc45aa-7721-476e-8994-ca552d772e75';
const $=x=>document.getElementById(x);let busy=false;
function headers(){const t=JSON.parse(localStorage.getItem('sanno_session_v1')||'null')?.access_token;if(!t)throw Error('ADMINでログインしてください');return {Authorization:'Bearer '+t,apikey:key,'Content-Type':'application/json'}}
async function state(){const r=await fetch(base+'/rest/v1/rpc/sanno_admin_reset_status_test',{method:'POST',headers:headers(),body:JSON.stringify({p_user_id:id}),cache:'no-store'});if(!r.ok)throw Error('状態取得 HTTP '+r.status);return await r.json()}
async function issue(signal){try{const r=await fetch(base+'/functions/v1/sanno-reset-password',{method:'POST',headers:headers(),body:JSON.stringify({target_user_id:id,confirm:true,confirm_display_name:'パスワード検証テスト'}),signal,cache:'no-store'});const d=await r.json();return {http:r.status,success:d.success===true,request_id:d.request_id||null,error:d.error||null};}catch(e){return {result:e.name==='AbortError'?'client_aborted':'network_error'}}}
async function run(mode){if(busy)return;busy=true;for(const b of document.querySelectorAll('button'))b.disabled=true;try{const s=await state();$('out').textContent='開始前: '+s;if(mode==='status')return;if($('name').value!=='パスワード検証テスト')throw Error('氏名を正確に入力してください');if(s!=='active')throw Error('ACTIVE状態でのみ開始できます');if(!confirm('検証用アカウントのパスワードを変更します。結果確認後、通常の管理画面で再発行が必要です。'))return;let result;if(mode==='parallel'){result=await Promise.all([issue(),issue()]);}else{const c=new AbortController();const p=issue(c.signal);setTimeout(()=>c.abort(),500);result=await p;} $('out').textContent+='\n通信結果: '+JSON.stringify(result,null,2)+'\n仮パスワードは表示・保存しません。';try{$('out').textContent+='\n直後の状態: '+await state()}catch(e){$('out').textContent+='\n状態取得失敗'} }catch(e){$('out').textContent+='\n'+e.message}finally{busy=false;for(const b of document.querySelectorAll('button'))b.disabled=false}}
$('status').onclick=()=>run('status');$('parallel').onclick=()=>run('parallel');$('abort').onclick=()=>run('abort');
</script></html>
