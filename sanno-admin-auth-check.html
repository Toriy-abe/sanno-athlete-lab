<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SANNO ADMIN AUTH CHECK</title><style>body{background:#100d17;color:#f6f1fc;font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:26px 18px}main{max-width:520px;margin:35px auto;background:#21182d;border:1px solid #6c4b87;border-radius:18px;padding:22px}h1{font-size:23px}p{line-height:1.7}button{background:#753eaa;color:white;border:0;border-radius:10px;padding:15px 20px;font-size:16px;width:100%;font-weight:bold}#result{white-space:pre-wrap;background:#110e19;border-radius:9px;padding:15px;min-height:60px;overflow-wrap:anywhere}.small{font-size:13px;color:#c6b5d4}</style></head><body><main><h1>ADMIN AUTH CHECK</h1><p>管理者認証の確認専用ページです。<strong>アカウント削除は行いません。</strong></p><p id="status">ログイン状態を確認しています…</p><button id="run" disabled>ADMIN認証をテスト</button><h2>結果</h2><div id="result">未実行</div><p class="small">この画面はトークンを表示・送信先以外に転送しません。終了後はテストページを削除できます。</p></main><script>
(()=>{'use strict';const status=document.getElementById('status'),out=document.getElementById('result'),btn=document.getElementById('run');let session,cfg;try{session=JSON.parse(localStorage.getItem('sanno_session_v1')||'null');cfg=JSON.parse(localStorage.getItem('sanno_config_v1')||'null')}catch{};const expected='https://xiqtfetzlzqkbhgyseqh.supabase.co';if(!session?.access_token){status.textContent='Safari側にログイン情報がありません。Safariで正式アプリにログインしてから、このページを開き直してください。';return}if(cfg?.url&&cfg.url.replace(/\/$/,'')!==expected){status.textContent='接続先が想定と異なるためテストを中止しました。';return}status.textContent='Safari側のログイン情報が見つかりました。認証テストを実行できます。';btn.disabled=false;btn.addEventListener('click',async()=>{btn.disabled=true;out.textContent='確認中…';try{const response=await fetch(expected+'/functions/v1/sanno-delete-player',{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg?.key||'sb_publishable_8V5gGyppGf-7P8iVSTOetw_QNPUYhIf','Authorization':'Bearer '+session.access_token},body:JSON.stringify({target_user_id:'not-a-uuid'})});const data=await response.json();let message='HTTP '+response.status+'\n';if(response.status===400&&data.error==='正しい選手IDを指定してください')message+='ADMIN権限の確認に成功しました。\n';else if(response.status===403)message+='ADMIN権限が認められませんでした。\n';else if(response.status===401)message+='ログイン情報が無効または期限切れです。\n';else message+='予期しない応答です。\n';out.textContent=message+'応答: '+JSON.stringify(data,null,2)}catch(e){out.textContent='通信エラー: '+String(e.message||e)}finally{btn.disabled=false}})})();
</script></body></html>
