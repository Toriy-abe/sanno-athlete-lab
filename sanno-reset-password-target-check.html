<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SANNO RESET TARGET CHECK</title>
<style>
body{margin:0;padding:20px;background:#100d17;color:#fff;
font-family:-apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:520px;margin:25px auto;padding:22px;
background:#21182d;border:1px solid #755093;border-radius:18px}
h1{font-size:22px}
p{line-height:1.7}
label{display:block;margin:20px 0 8px}
input{box-sizing:border-box;width:100%;padding:14px;
font-size:16px;border-radius:9px;border:1px solid #9575ae}
button{width:100%;margin-top:18px;padding:16px;
background:#7540a8;color:white;border:0;
border-radius:10px;font-size:16px;font-weight:bold}
button:disabled{opacity:.45}
pre{white-space:pre-wrap;overflow-wrap:anywhere;
background:#110e19;padding:15px;border-radius:9px}
small{color:#c9b9d5;line-height:1.7}
</style>
</head>
<body>
<main>
<h1>RESET TARGET CHECK</h1>
<p>ADMIN認証とテスト対象の確認を行います。</p>
<p><strong>パスワードは変更しません。</strong></p>

<p id="status">ログイン状態を確認中…</p>

<label for="uid">テストアカウントのUser UID</label>
<input id="uid" type="text"
placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
autocomplete="off" spellcheck="false">

<button id="run" disabled>テスト対象を確認</button>

<h2>確認結果</h2>
<pre id="result">未実行</pre>

<small>
ADMINでログインしたSafariから実行してください。
認証トークンは画面に表示しません。
UIDはブラウザに保存しません。
</small>
</main>

<script>
(() => {
  "use strict";

  const endpoint =
    "https://xiqtfetzlzqkbhgyseqh.supabase.co"
    + "/functions/v1/sanno-reset-lock-check";

  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const button = document.getElementById("run");
  const input = document.getElementById("uid");

  let session = null;
  let config = null;

  try {
    session = JSON.parse(
      localStorage.getItem("sanno_session_v1") || "null"
    );
    config = JSON.parse(
      localStorage.getItem("sanno_config_v1") || "null"
    );
  } catch {
    status.textContent = "ログイン情報を読み取れません。";
    return;
  }

  const baseUrl =
    "https://xiqtfetzlzqkbhgyseqh.supabase.co";

  if (!session?.access_token) {
    status.textContent =
      "ログイン情報がありません。正式アプリにログインしてください。";
    return;
  }

  if (
    config?.url &&
    config.url.replace(/\/$/, "") !== baseUrl
  ) {
    status.textContent =
      "接続先が想定と異なるため中止しました。";
    return;
  }

  status.textContent = "ログイン情報を確認しました。";
  button.disabled = false;

  button.addEventListener("click", async () => {
    const uid = input.value.trim();

    const uuidPattern =
      /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

    if (!uuidPattern.test(uid)) {
      result.textContent =
        "正しいUser UIDを入力してください。";
      return;
    }

    button.disabled = true;
    result.textContent = "確認中…";

    try {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": config?.key ||
            "sb_publishable_8V5gGyppGf-7P8iVSTOetw_QNPUYhIf",
          "Authorization": "Bearer " + session.access_token
        },
        body: JSON.stringify({
          target_user_id: uid
        })
      });

      const data = await response.json();

      if (
        response.status === 200 &&
        data.success === true &&
        data.mode === "preview_only" &&
        data.target_verified === true
      ) {
        result.textContent =
          "HTTP 200\n" +
          "ADMIN認証：成功\n" +
          "テスト対象確認：成功\n" +
          "パスワード変更：なし";
      } else {
        result.textContent =
          "HTTP " + response.status + "\n" +
          JSON.stringify(data, null, 2);
      }
    } catch {
      result.textContent =
        "通信エラーが発生しました。";
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
