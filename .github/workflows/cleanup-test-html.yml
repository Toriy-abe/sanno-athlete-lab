name: Cleanup SANNO test HTML
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview or delete'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - delete
permissions:
  contents: write
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check or remove explicitly listed files
        env:
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin-password-reset-test.html
            password-change-test.html
            sanno-integration-v1.html
            sanno-integration-v2.html
            sanno-monitor-simulation.html
            sanno-password-monitor-v1.html
            sanno-password-monitor-v2.html
            sanno-password-recovery-v2.html
            sanno-password-ui-test.html
            sanno-reset-network-test.html
          )
          echo 'Root HTML files:'
          git ls-files -- '*.html' | grep -v / || true
          echo '## Cleanup targets' >> "$GITHUB_STEP_SUMMARY"
          for f in "${files[@]}"; do
            if git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
              echo "- $f" | tee -a "$GITHUB_STEP_SUMMARY"
              if [[ "$MODE" == delete ]]; then git rm -- "$f"; fi
            else
              echo "- Not found: $f" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [[ "$MODE" == delete ]] && ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Remove verified test HTML pages'
            git push origin HEAD:main
          fi
