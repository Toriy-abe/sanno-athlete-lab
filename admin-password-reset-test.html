<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SANNO Password Reset Test</title>
<style>
* {
  box-sizing: border-box;
}
body {
  background: #101014;
  color: #fff;
  font-family: -apple-system, sans-serif;
  padding: 20px;
  margin: 0;
}
main {
  max-width: 480px;
  margin: auto;
}
h1 {
  font-size: 23px;
}
.card {
  background: #1c1c24;
  border: 1px solid #50416e;
  border-radius: 14px;
  padding: 18px;
  margin: 16px 0;
}
input, button {
  width: 100%;
  padding: 14px;
  border-radius: 8px;
  font-size: 16px;
  margin: 8px 0;
}
input {
  background: #101014;
  color: white;
  border: 1px solid #777;
}
button {
  background: #583c91;
  color: white;
  border: 0;
  font-weight: bold;
}
button:disabled {
  opacity: .4;
}
.danger {
  background: #a52d43;
}
small {
  color: #aaa;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 14px;
}
#password {
  font-size: 24px;
  font-weight: bold;
  color: #d9c3ff;
  overflow-wrap: anywhere;
  user-select: all;
}
</style>
</head>
<body>
<main>

<h1>SANNO ATHLETE LAB</h1>
<small>ADMIN / PASSWORD RESET TEST</small>

<div class="card">
  <h3>認証状態</h3>
  <div id="authStatus">未確認</div>
  <button id="check">ログイン状態を確認</button>
</div>

<div class="card">
  <h3>検証対象</h3>
  <p>パスワード検証テスト</p>
  <small>検証専用アカウント</small>
  <p>確認のため、対象者の氏名を入力してください。</p>

  <input
    id="confirmName"
    placeholder="対象者の氏名"
    autocomplete="off"
  >

  <button
    id="reset"
    class="danger"
    disabled
  >
    仮パスワードを発行
  </button>
</div>

<div class="card" id="passwordCard" hidden>
  <h3>仮パスワード</h3>
  <div id="password"></div>
  <button id="copy">コピー</button>
  <button id="clear">表示を消去</button>
  <small>
    このパスワードは再表示できません。
    第三者に公開しないでください。
  </small>
</div>

<div class="card">
  <h3>処理結果</h3>
  <pre id="result">待機中</pre>
</div>

</main>

<script>
const URL_BASE =
  "https://xiqtfetzlzqkbhgyseqh.supabase.co";

const API_KEY =
  "sb_publishable_8V5gGyppGf-7P8iVSTOetw_QNPUYhIf";

const TARGET_ID =
  "b1fc45aa-7721-476e-8994-ca552d772e75";

const TARGET_NAME =
  "パスワード検証テスト";

const $ = id => document.getElementById(id);

let ready = false;
let busy = false;
let issued = false;

function getToken() {
  try {
    const session = JSON.parse(
      localStorage.getItem("sanno_session_v1")
      || "null"
    );

    return session?.access_token || null;
  } catch {
    return null;
  }
}

function headers(token) {
  return {
    "apikey": API_KEY,
    "Authorization": "Bearer " + token,
    "Content-Type": "application/json"
  };
}

function showResult(data) {
  $("result").textContent =
    JSON.stringify(data, null, 2);
}

function updateButton() {
  $("reset").disabled =
    !ready || busy || issued ||
    $("confirmName").value !== TARGET_NAME;
}

$("confirmName").oninput = updateButton;

$("check").onclick = async () => {
  ready = false;
  updateButton();

  const token = getToken();

  if (!token) {
    $("authStatus").textContent =
      "正式版でログインしてください";
    return;
  }

  try {
    const response = await fetch(
      URL_BASE + "/auth/v1/user",
      {
        headers: headers(token),
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("認証失敗");
    }

    ready = true;

    $("authStatus").textContent =
      "ログイン確認済み（ADMIN権限は発行時にサーバーで確認）";

    updateButton();

  } catch {
    $("authStatus").textContent =
      "認証エラー。再ログインしてください";
  }
};

$("reset").onclick = async () => {
  if (!ready || busy || issued) return;

  if ($("confirmName").value !== TARGET_NAME) {
    return;
  }

  if (!confirm(
    "検証用アカウントのパスワードを変更します。"
  )) return;

  const token = getToken();

  if (!token) {
    ready = false;
    updateButton();
    return;
  }

  busy = true;
  updateButton();

  $("result").textContent = "処理中...";

  try {
    const response = await fetch(
      URL_BASE +
      "/functions/v1/sanno-reset-password",
      {
        method: "POST",
        headers: headers(token),
        cache: "no-store",
        body: JSON.stringify({
          target_user_id: TARGET_ID,
          confirm: true,
          confirm_display_name: TARGET_NAME
        })
      }
    );

    const data = await response.json();

    const temporaryPassword =
      data.temporary_password;

    delete data.temporary_password;

    showResult({
      http_status: response.status,
      ...data
    });

    if (
      response.ok &&
      data.success === true &&
      typeof temporaryPassword === "string"
    ) {
      issued = true;

      $("password").textContent =
        temporaryPassword;

      $("passwordCard").hidden = false;
    }

  } catch {
    issued = true;

    showResult({
      error: "通信エラー。再実行せずDB状態を確認してください"
    });

  } finally {
    busy = false;
    updateButton();
  }
};

$("copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText(
      $("password").textContent
    );

    $("copy").textContent = "コピー完了";

  } catch {
    alert("パスワードを長押ししてコピーしてください");
  }
};

function clearPassword() {
  $("password").textContent = "";
  $("passwordCard").hidden = true;
}

$("clear").onclick = clearPassword;

window.addEventListener(
  "pagehide",
  clearPassword
);

</script>
</body>
</html>
