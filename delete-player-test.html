<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SANNO ADMIN DELETE TEST</title>
<style>
* {
  box-sizing: border-box;
}
body {
  background: #101014;
  color: white;
  font-family: sans-serif;
  padding: 20px;
}
.card {
  background: #211b30;
  border-radius: 16px;
  padding: 20px;
}
input, button {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  border-radius: 10px;
  font-size: 16px;
}
input {
  background: #15121d;
  color: white;
  border: 1px solid #777;
}
button {
  background: #a52838;
  color: white;
  border: none;
}
button:disabled {
  opacity: 0.4;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.warning {
  color: #ff9292;
}
</style>
</head>
<body>

<h2>SANNO ATHLETE LAB</h2>
<p>ADMIN / DELETE PLAYER TEST</p>

<div class="card">
  <h3>関連記録の連動削除テスト</h3>
  <p>対象：削除検証テスト</p>
  <p>対象トレーニング記録：1件</p>

  <p class="warning">
    アカウントと関連記録が完全に削除されます。
    この操作は取り消せません。
  </p>

  <input
    id="name"
    placeholder="削除対象の氏名を入力"
    autocomplete="off"
  >

  <button id="remove" disabled>
    アカウントを完全削除
  </button>

  <pre id="result">確認待ち</pre>
</div>

<script>
const url = "https://xiqtfetzlzqkbhgyseqh.supabase.co";
const key = "sb_publishable_8V5gGyppGf-7P8iVSTOetw_QNPUYhIf";
const target = "0bc3cbac-fd17-4f93-86f5-b270fd3467fc";
const targetName = "削除検証テスト";

const input = document.getElementById("name");
const button = document.getElementById("remove");
const result = document.getElementById("result");

let busy = false;
let finished = false;

input.oninput = () => {
  button.disabled =
    busy || finished || input.value !== targetName;
};

button.onclick = async () => {
  if (busy || finished || input.value !== targetName) {
    return;
  }

  if (!window.confirm(
    "削除検証テストと関連記録を完全に削除しますか？"
  )) {
    return;
  }

  busy = true;
  button.disabled = true;
  input.disabled = true;
  result.textContent = "削除処理中...";

  try {
    const session = JSON.parse(
      localStorage.getItem("sanno_session_v1") || "null"
    );

    if (!session?.access_token) {
      throw new Error("正式版でADMINログインしてください");
    }

    const response = await fetch(
      url + "/functions/v1/sanno-delete-player",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": key,
          "Authorization": "Bearer " + session.access_token
        },
        body: JSON.stringify({
          target_user_id: target,
          confirm: true,
          confirm_display_name: input.value
        })
      }
    );

    const data = await response.json();

    result.textContent =
      "HTTP: " + response.status + "\n\n" +
      JSON.stringify(data, null, 2);

  } catch (error) {
    result.textContent = error.message;
  } finally {
    busy = false;
    finished = true;
    button.disabled = true;
    input.disabled = true;
  }
};
</script>

</body>
</html>
