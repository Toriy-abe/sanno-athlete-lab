<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SANNO ATHLETE LAB | TOP10 DEMO</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c0b12;color:#f5f2fb;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif}.wrap{max-width:540px;margin:auto;padding:24px 16px 48px}.brand{font-weight:900;letter-spacing:.12em;color:#c9a6ff;font-size:13px}.title{font-size:27px;font-weight:900;margin:8px 0}.notice{background:#302044;border:1px solid #9e6cdb;border-radius:12px;padding:12px;font-size:13px;line-height:1.6;margin:18px 0}.tabs,.sports{display:flex;gap:7px;margin:15px 0}.tabs button,.sports button{flex:1;min-width:0;background:#211a2d;color:#dcd0ee;border:1px solid #574269;border-radius:9px;padding:12px 3px;font-weight:800;font-size:11px}.tabs button.on,.sports button.on{background:#6c39a6;border-color:#bb8eff;color:white}.card{background:#17131f;border:1px solid #42334f;border-radius:16px;padding:18px 14px}.card h2{font-size:19px;margin:0 0 6px}.sub{color:#b5a6c5;font-size:12px;margin-bottom:12px}.row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid #302638} .row:last-child{border:0}.row.podium{border:1px solid transparent;border-radius:10px;margin:5px 0;padding:12px 7px;grid-template-columns:66px 1fr auto;gap:5px}.row.podium-1{background:linear-gradient(100deg,rgba(212,164,48,.23),rgba(212,164,48,.065));border-color:rgba(245,201,87,.50)}.row.podium-2{background:linear-gradient(100deg,rgba(184,196,211,.20),rgba(184,196,211,.045));border-color:rgba(207,217,229,.42)}.row.podium-3{background:linear-gradient(100deg,rgba(189,111,67,.22),rgba(189,111,67,.05));border-color:rgba(213,143,103,.43)}.podium-1 .rank{color:#ffe19b}.podium-2 .rank{color:#e0e9f4}.podium-3 .rank{color:#eab18f}.medal{font-size:17px;margin-right:3px}.rank{white-space:nowrap}.rank{font-size:16px;font-weight:900;color:#c9a6ff}.name{font-size:14px;font-weight:650}.kg{font-weight:850;font-size:16px}.foot{color:#ad9bbd;font-size:12px;margin-top:16px;line-height:1.7}</style></head><body><main class="wrap"><div class="brand">SANNO ATHLETE LAB</div><h1 class="title">RANKING <span style="color:#b77cff">TOP 10 🏅</span></h1><div class="notice">🧪 <b>表示テスト専用</b>｜このページの選手名・重量はすべて架空のデータです。Supabaseへの接続・記録の変更・ログイン処理は行いません。</div><div class="tabs" id="modes"><button class="on" data-mode="latest">LATEST MAX</button><button data-mode="pr">PERSONAL BEST</button><button data-mode="all">ALL-TIME</button></div><div class="sports" id="sports"><button class="on" data-sport="back_squat">SQ</button><button data-sport="bench_press">BP</button><button data-sport="clean">CLN</button></div><section class="card"><h2 id="heading"></h2><div class="sub" id="sub"></div><div id="rows"></div></section><p class="foot">🥇金・🥈銀・🥉銅は1〜3位に表示。同順位には同じメダルを表示します。表示人数は最大10人。重量が同じ場合は同順位（例：2位・2位・4位）。順位は15人全員を対象に計算してから、上位10人を表示します。</p></main><script>const names=Array.from({length:15},(_,i)=>'テスト選手'+(i+1));let mode='latest',sport='back_squat';const sports={back_squat:['バックスクワット',195],bench_press:['ベンチプレス',135],clean:['クリーン',115]};const modes={latest:'最新MAX',pr:'自己ベスト',all:'歴代最高記録'};function render(){let start=sports[sport][1]+(mode==='pr'?10:mode==='all'?20:0);let records=names.map((name,i)=>({name,weight:start-i*5}));records[2].weight=records[1].weight;records.sort((a,b)=>b.weight-a.weight||a.name.localeCompare(b.name,'ja'));let prev=null,rank=0;records.forEach((r,i)=>{if(r.weight!==prev)rank=i+1;r.rank=rank;prev=r.weight});document.getElementById('heading').textContent=sports[sport][0]+' ／ '+modes[mode]+' TOP10';document.getElementById('sub').textContent='架空の15選手から上位10人を表示';document.getElementById('rows').innerHTML=records.slice(0,10).map(r=>'<div class="row'+(r.rank<=3?' podium podium-'+r.rank:'')+'"><span class="rank">'+({1:'🥇',2:'🥈',3:'🥉'}[r.rank]?'<span class="medal">'+({1:'🥇',2:'🥈',3:'🥉'}[r.rank])+'</span>':'')+r.rank+'位</span><span class="name">'+r.name+'</span><span class="kg">'+r.weight+' kg</span></div>').join('')}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));render()});document.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{sport=b.dataset.sport;document.querySelectorAll('[data-sport]').forEach(x=>x.classList.toggle('on',x===b));render()});render();</script></body></html>
