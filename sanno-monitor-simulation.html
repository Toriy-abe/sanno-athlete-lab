<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SANNO MONITOR SIMULATION</title><style>body{background:#171020;color:#eee;font:16px system-ui;padding:20px}section{background:#251a35;padding:18px;border-radius:16px;margin:20px 0}button{background:#493363;color:white;border:0;border-radius:10px;padding:14px;margin:5px 0;min-height:44px;font-weight:bold}button:disabled{opacity:.45}p{line-height:1.7;overflow-wrap:anywhere}small{color:#cbb9de}</style><h2>SANNO ATHLETE LAB</h2><h3>MONITOR V2 / 疑似状態検証</h3><p>オフライン検証専用。実際のアカウント・DB・通信には接続しません。</p><div id="cases"></div><script>function render(d,el,button){ const r=d?.status;const labels={active:'ACTIVE / 通常利用可能',waiting:'PASSWORD RESET REQUIRED / 変更待ち',processing:'PROCESSING / 処理中',failed:'FAILED / 復旧が必要',needs_review:'NEEDS REVIEW / 管理者確認が必要'};
 if(!Object.hasOwn(labels,r))throw Error('不明な状態');
 el.textContent=labels[r]+' ｜ MONITOR V2 / SIMULATION';
 if(d.locked_at){const t=new Date(d.locked_at);if(Number.isFinite(t.getTime()))el.append(document.createElement('br'), '処理開始: '+t.toLocaleString('ja-JP')+' / 経過 '+Math.max(0,Math.floor(d.elapsed_seconds/60))+'分');}
 if(d.request_id)el.append(document.createElement('br'),'調査ID: '+d.request_id);
 if(r==='processing'&&d.elapsed_seconds>=300||r==='needs_review')el.append(document.createElement('br'),'⚠ 管理者確認が必要です。自動解除は行いません。');
 button.dataset.resetState=r;button.textContent=r==='failed'?'RECOVER PASSWORD / パスワード復旧（ADMIN・TEST）':'RESET PASSWORD / パスワード再設定（ADMIN・TEST）';button.disabled=!['active','waiting','failed'].includes(r);return true;}const cases=[['① PROCESSING / 1分','processing',60],['② PROCESSING / 6分','processing',360],['③ NEEDS REVIEW','needs_review',60]];for(const [name,status,seconds] of cases){const section=document.createElement('section');const h=document.createElement('h3');h.textContent=name;const el=document.createElement('p');const b=document.createElement('button');b.type='button';section.append(h,el,b);document.getElementById('cases').append(section);render({status,elapsed_seconds:seconds,locked_at:new Date(Date.now()-seconds*1000).toISOString(),request_id:'SIMULATION-'+seconds+'-'+status},el,b);const result=document.createElement('small');result.textContent=b.disabled?'操作制限: 無効化済み':'操作制限: 要確認';section.append(document.createElement('br'),result);}</script></html>
